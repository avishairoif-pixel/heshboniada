name: Android installable APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
        continue-on-error: true

      - name: Install SDK packages (fallback)
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true

      - name: Install dependencies
        run: npm install

      - name: Build bundled offline game
        run: npm run build

      - name: Generate native Android project and sync web assets
        run: |
          npx cap add android
          npx cap sync android
          npx @capacitor/assets generate --android

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK to a friendly name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Heshboniada.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heshboniada-android-apk
          path: android/app/build/outputs/apk/debug/Heshboniada.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "החשבוניאדה — גרסה אחרונה"
          body: "אפליקציית אנדרואיד מלאה שעובדת אופליין. הורד את Heshboniada.apk והתקן בטלפון."
          files: android/app/build/outputs/apk/debug/Heshboniada.apk
          make_latest: true
