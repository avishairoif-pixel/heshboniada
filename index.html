<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>החשבוניאדה — עזרי לשלומפר לנצח במרוץ החשבון! 🦄</title>
    <meta
      name="description"
      content="משחק חשבון קסום לכיתה ב׳ — עזרי לשלומפר החד-קרן לנצח בתחרות החשבוניאדה! 9 תחנות, 5 שאלות בכל תחנה, כוכבים ודמויות מתוקות."
    />
    <meta name="theme-color" content="#25123d" />
    <!-- PWA: התקנה כאפליקציה -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/app-icon-512.png" />
    <link rel="apple-touch-icon" href="icons/app-icon-512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="חשבוניאדה" />

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        background-color: #25123d;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        /* התחשבות במגרעת המצלמה ובפס הניווט התחתון של סמסונג */
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
